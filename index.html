  <script>
    // Paint the field before first frame, and mark that scripting is available
    // so the stylesheet can opt into hidden-then-revealed states. Without the
    // flag the no-JS page would sit at whatever the entrance animation starts
    // from and never arrive.
    document.documentElement.classList.add('js');
    document.documentElement.style.background = '#05070D';
  </script>
