  <title>Nguyen Tien Dat — Frontend Developer</title>
  <script>
    // Paint the deep field before first frame; read the motion preference early
    // so ambient layers never flash on for a visitor who turned them off.
    (function () {
      document.documentElement.dataset.theme = 'dark';
      document.documentElement.style.background = '#04060C';
      try {
        var fx = localStorage.getItem('pp-bgfx');
        document.documentElement.dataset.bgfx = fx === 'off' ? 'off' : 'on';
      } catch (e) {
        document.documentElement.dataset.bgfx = 'on';
      }
    })();
  </script>
</head>

  </div>

</body>
